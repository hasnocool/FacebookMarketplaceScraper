[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "facebook-marketplace-scraper"
version = "0.2.0"
description = "Async-first Facebook Marketplace collection, history, scoring, watchlist, daemon, and dashboard toolkit."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "hasnocool"}]
dependencies = [
  "fastapi>=0.139.2",
  "playwright>=1.61.0",
  "pydantic>=2.11.0",
  "typer>=0.16.0",
  "uvicorn>=0.51.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[project.scripts]
fb-market = "facebook_marketplace_scraper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/facebook_marketplace_scraper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501"]
